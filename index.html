<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Watchlist 🎬</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🎬 Mi Watchlist</h1><span id="stats"></span></header>

<div class="toolbar">
  <input id="search" type="search" placeholder="🔍 Buscar título o género...">
  <div class="filters">
    <button data-f="all" class="on">Todos</button>
    <button data-f="movie">Películas</button>
    <button data-f="series">Series</button>
  </div>
  <select id="sort">
    <option value="recent">Más recientes</option>
    <option value="stars">Más estrellas ★</option>
    <option value="score">Mayor puntuación /100</option>
    <option value="az">Título A–Z</option>
    <option value="year">Por año</option>
  </select>
  <button id="export" title="Exportar JSON">⬇ Exportar</button>
  <button id="import" title="Importar JSON">⬆ Importar</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <button id="add" class="primary">＋ Agregar</button>
</div>

<main id="grid"></main>

<dialog id="detail"></dialog>

<dialog id="form">
  <form id="f">
    <h2 id="ftitle"></h2>
    <p class="lb">Tipo</p>
    <div class="seg">
      <label><input type="radio" name="type" value="movie" checked> 🎬 Película</label>
      <label><input type="radio" name="type" value="series"> 📺 Serie</label>
    </div>
    <label>Título *<input name="title" required maxlength="120" placeholder="Nombre de la película o serie"></label>
    <div class="row">
      <label>Año<input name="year" type="number" min="1888" placeholder="2024"></label>
      <label>Género<input name="genre" maxlength="80" placeholder="Drama, Acción..."></label>
    </div>
    <label>Descripción / notas<textarea name="desc" rows="3"></textarea></label>
    <p class="lb">Calificación con estrellas</p>
    <div id="stars" class="starpick"></div>
    <p class="lb">Puntuación (0–100 · 0 = sin puntuar) <b id="sd"></b></p>
    <div class="row">
      <input type="range" id="sr" min="0" max="100" value="0">
      <input type="number" id="sn" min="0" max="100" placeholder="0" style="max-width:80px">
    </div>
    <fieldset id="eps" hidden>
      <legend>📺 Progreso de la serie</legend>
      <div class="row">
        <label>Temporadas vistas<input name="ws" type="number" min="0" value="0"></label>
        <label>Temporadas totales<input name="ts" type="number" min="0" value="0"></label>
      </div>
      <div class="row">
        <label>Episodios vistos<input name="we" type="number" min="0" value="0"></label>
        <label>Episodios totales<input name="te" type="number" min="0" value="0"></label>
      </div>
    </fieldset>
    <p class="lb">Imagen / póster</p>
    <input type="file" id="file" accept="image/*">
    <div class="row">
      <input id="url" placeholder="O pega una URL de imagen...">
      <button type="button" id="loadUrl" style="flex:0 0 auto">Cargar</button>
    </div>
    <img id="prev" alt="Vista previa del póster" hidden>
    <div class="actions end">
      <button type="button" id="cancel">Cancelar</button>
      <button class="primary">💾 Guardar</button>
    </div>
  </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
